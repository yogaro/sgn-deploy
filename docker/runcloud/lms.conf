# RunCloud web app LMS_DOMAIN: content of the predefined "Proxy" NGiNX config (replace the generated content).
# Host must pass through unchanged: presigned media URLs (/lms-files/) are signed for it.
location / {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Course videos and PDFs go up to 600 MB, streamed straight to object storage.
    client_max_body_size 600m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
