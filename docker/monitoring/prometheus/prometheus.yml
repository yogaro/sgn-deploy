# Scrapes every SGN service on its internal metrics port (METRICS_ADDR=:9091, not published to the host).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
  - job_name: iam
    static_configs: [{ targets: ['iam:9091'] }]
  - job_name: hr
    static_configs: [{ targets: ['hr:9091'] }]
  - job_name: hr-worker
    static_configs: [{ targets: ['hr-worker:9091'] }]
  - job_name: lms
    static_configs: [{ targets: ['lms:9091'] }]
  - job_name: lms-worker
    static_configs: [{ targets: ['lms-worker:9091'] }]
  - job_name: directory
    static_configs: [{ targets: ['directory:9091'] }]
  - job_name: postgres
    static_configs: [{ targets: ['postgres-exporter:9187'] }]
  - job_name: node
    static_configs: [{ targets: ['node-exporter:9100'] }]
