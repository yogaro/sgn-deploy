# Server overlay: HTTPS through Caddy, public origins from .env, no app port open to the internet.
# Used together with compose.yaml through COMPOSE_FILE in .env (docker/vps-bootstrap.sh writes it).
# Every browser call is same-origin through the frontends' nginx, so ALLOWED_ORIGIN only names each app's own host.
services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?set PORTAL_DOMAIN in .env}
      LMS_DOMAIN: ${LMS_DOMAIN:?set LMS_DOMAIN in .env}
      DIRECTORY_DOMAIN: ${DIRECTORY_DOMAIN:?set DIRECTORY_DOMAIN in .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports: ['80:80', '443:443', '443:443/udp']
    restart: unless-stopped
    depends_on: [portal, lms-fe, directory-fe, directory]

  iam:
    environment:
      ALLOWED_ORIGIN: https://${PORTAL_DOMAIN:?set PORTAL_DOMAIN in .env}
      COOKIE_SECURE: 'true'
    ports: !reset []

  hr:
    environment:
      ALLOWED_ORIGIN: https://${PORTAL_DOMAIN:?set PORTAL_DOMAIN in .env}
    ports: !reset []

  # ALLOWED_ORIGIN is also the address printed on certificate PDFs (<origin>/lms/verifikasi/<number>).
  lms:
    environment:
      ALLOWED_ORIGIN: https://${LMS_DOMAIN:?set LMS_DOMAIN in .env}
      S3_PUBLIC_URL: https://${LMS_DOMAIN}
    ports: !reset []

  lms-worker:
    environment:
      S3_PUBLIC_URL: https://${LMS_DOMAIN:?set LMS_DOMAIN in .env}

  directory:
    environment:
      ALLOWED_ORIGIN: https://${DIRECTORY_DOMAIN:?set DIRECTORY_DOMAIN in .env}
      COOKIE_SECURE: 'true'
    ports: !reset []

  portal:
    ports: !reset []

  # Kept on loopback only: seed/run.sh and the bootstrap script talk to the LMS through it.
  lms-fe:
    ports: !override ['127.0.0.1:${LMS_WEB_PORT:-3003}:80']

  directory-fe:
    build:
      args:
        VITE_DIRECTORY_SERVICE_URL: https://${DIRECTORY_DOMAIN}/api
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
